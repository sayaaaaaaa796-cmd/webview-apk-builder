// Top-level build file tempat Anda menambahkan opsi konfigurasi yang berlaku untuk semua sub-proyek/modul.

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.0'
    }
}

// Catatan: Blok 'allprojects { repositories { ... } }' telah dihapus dari file ini
// untuk mencegah konflik dengan pengaturan 'dependencyResolutionManagement' di settings.gradle.
