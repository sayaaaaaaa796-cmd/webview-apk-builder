<!DOCTYPE html>
<html>
<head>
    <title>I Love You — Heart Animation</title>
    <style>
        body { margin: 0; background: #0b0b0e; display: flex; justify-content: center; align-items: center; height: 100vh; }
        canvas { display: block; }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <script>
        // === CLASS POINT (dari video) ===
        var Point = (function () {
            function Point(x, y) {
                this.x = (typeof x != 'undefined') ? x : 0;
                this.y = (typeof y != 'undefined') ? y : 0;
            }
            Point.prototype.clone = function () {
                return new Point(this.x, this.y);
            };
            return Point;
        })();

        // === SETUP CANVAS ===
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // === PARAMETER HATI ===
        const center = new Point(canvas.width/2, canvas.height/2);
        const points = [];
        const count = 200;

        // === GENERATE TITIK HATI ===
        for (let i = 0; i < count; i++) {
            const t = (i / count) * Math.PI * 2;
            const x = 16 * Math.pow(Math.sin(t), 3);
            const y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
            points.push(new Point(x * 12 + center.x, -y * 12 + center.y));
        }

        // === ANIMASI ===
        let frame = 0;
        function animate() {
            ctx.fillStyle = 'rgba(11, 11, 14, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Gambar titik hati dengan efek glow
            points.forEach((p, i) => {
                const offsetX = Math.sin(frame * 0.02 + i) * 2;
                const offsetY = Math.cos(frame * 0.03 + i) * 2;
                const size = 3 + Math.sin(frame * 0.05 + i) * 1.5;

                ctx.beginPath();
                ctx.arc(p.x + offsetX, p.y + offsetY, size, 0, Math.PI * 2);
                const gradient = ctx.createRadialGradient(
                    p.x + offsetX, p.y + offsetY, 0,
                    p.x + offsetX, p.y + offsetY, size * 2
                );
                gradient.addColorStop(0, `hsl(${340 + Math.sin(frame * 0.02 + i) * 20}, 100%, 60%)`);
                gradient.addColorStop(1, 'rgba(255, 0, 100, 0)');
                ctx.fillStyle = gradient;
                ctx.fill();
            });

            // Teks "I Love You"
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 48px Arial';
            ctx.textAlign = 'center';
            ctx.shadowColor = '#ff00ff';
            ctx.shadowBlur = 40;
            ctx.fillText('I ❤️ You', canvas.width/2, canvas.height/2 + 120);

            frame++;
            requestAnimationFrame(animate);
        }
        animate();

        // === RESPONSIVE ===
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            center.x = canvas.width/2;
            center.y = canvas.height/2;
        });
    </script>
</body>
</html>
