name: Build Mood Reaper NUCLEAR

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout kode dari repositori
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Java JDK 17 + Cache Gradle untuk proses build lebih cepat
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      # 3. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 4. Generasi otomatis gradlew versi 8.4 secara terisolasi jika tidak ada
      - name: Setup & Grant execute permission for gradlew
        run: |
          if [ ! -f "./gradlew" ] && [ ! -f "./android/gradlew" ]; then
            echo "gradlew tidak ditemukan. Membuat Gradle Wrapper 8.4 di folder terisolasi..."
            
            # Buat wrapper di folder sementara agar tidak membaca build.gradle proyek
            mkdir -p /tmp/gradle-init
            cd /tmp/gradle-init
            gradle wrapper --gradle-version 8.4
            cd $GITHUB_WORKSPACE

            # Tentukan lokasi tujuan (root atau subfolder android)
            if [ -d "./android" ] && { [ -f "./android/build.gradle" ] || [ -f "./android/build.gradle.kts" ]; }; then
              cp -r /tmp/gradle-init/gradlew /tmp/gradle-init/gradlew.bat /tmp/gradle-init/gradle ./android/
            else
              cp -r /tmp/gradle-init/gradlew /tmp/gradle-init/gradlew.bat /tmp/gradle-init/gradle ./
            fi
          fi

          # Set izin eksekusi dan simpan perintah gradlew ke variabel environment
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            echo "GRADLE_EXEC=./gradlew" >> $GITHUB_ENV
          elif [ -f "./android/gradlew" ]; then
            chmod +x android/gradlew
            echo "GRADLE_EXEC=./android/gradlew" >> $GITHUB_ENV
          fi

      # 5. Build APK Release
      - name: Build APK Release
        run: $GRADLE_EXEC assembleRelease

      # 6. Process Signing & Alignment APK (Pencarian file dinamis)
      - name: Sign & Align APK
        run: |
          # Ambil path zipalign & apksigner terbaru dari SDK
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
          ZIPALIGN=$BUILD_TOOLS_DIR/zipalign
          APKSIGNER=$BUILD_TOOLS_DIR/apksigner

          # Cari APK hasil build secara otomatis
          UNSIGNED_APK=$(find . -type f -path "*/build/outputs/apk/release/*-unsigned.apk" | head -n 1)

          if [ -z "$UNSIGNED_APK" ]; then
            UNSIGNED_APK=$(find . -type f -path "*/build/outputs/apk/release/*.apk" ! -name "*aligned*" | head -n 1)
          fi

          echo "APK yang akan di-sign: $UNSIGNED_APK"
          APK_DIR=$(dirname "$UNSIGNED_APK")
          ALIGNED_APK="$APK_DIR/MoodReaper_Nuclear_aligned.apk"
          FINAL_APK="$APK_DIR/MoodReaper_Nuclear.apk"

          # Buat Keystore sementara (Dummy)
          keytool -genkey -v -keystore keystore.jks \
            -alias reaper -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Reaper, OU=ID, O=Reaper, L=City, S=State, C=ID" \
            -storepass 123456 -keypass 123456

          # 1. Align APK
          $ZIPALIGN -v -p 4 "$UNSIGNED_APK" "$ALIGNED_APK"

          # 2. Sign APK menggunakan apksigner (Scheme V2/V3)
          $APKSIGNER sign --ks keystore.jks \
            --ks-pass pass:123456 \
            --ks-key-alias reaper \
            --key-pass pass:123456 \
            --out "$FINAL_APK" "$ALIGNED_APK"

          # Simpan path APK akhir agar bisa diunggah di langkah berikutnya
          echo "FINAL_APK_PATH=$FINAL_APK" >> $GITHUB_ENV

      # 7. Upload Hasil Akhir APK sebagai Artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoodReaper-Nuclear
          path: ${{ env.FINAL_APK_PATH }}
          if-no-files-found: error
