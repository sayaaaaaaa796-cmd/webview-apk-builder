name: Build Mood Reaper NUCLEAR

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build APK Release
      run: ./gradlew assembleRelease

    - name: Sign APK with dummy keystore
      run: |
        keytool -genkey -v -keystore keystore.jks -alias reaper -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Reaper, OU=ID, O=Reaper, L=City, S=State, C=ID" -storepass 123456 -keypass 123456
        jarsigner -verbose -sigalg SHA1withRSA -digestalg SHA1 -keystore keystore.jks -storepass 123456 app/build/outputs/apk/release/app-release-unsigned.apk reaper
        zipalign -v 4 app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/release/MoodReaper_Nuclear.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MoodReaper-Nuclear
        path: app/build/outputs/apk/release/MoodReaper_Nuclear.apk